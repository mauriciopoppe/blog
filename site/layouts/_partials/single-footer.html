<style>
.sunset-footer {
  position: relative;
  z-index: 0;
  margin-top: -26vh;
}
body > header,
body > section {
  position: relative;
  z-index: 1;
}
.sunset-footer-scene {
  position: relative;
  height: 82vh;
  min-height: 480px;
  overflow: visible;
}
.sunset-footer-scene > #browser-sunset {
  position: relative;
  z-index: 0;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0, 0, 0, 0.35) 10%, #000 24%);
  mask-image: linear-gradient(to bottom, transparent 0%, rgba(0, 0, 0, 0.35) 10%, #000 24%);
}
.sunset-footer-scene > span {
  z-index: 2;
}
.sunset-footer--sandbox {
  margin-top: 0;
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
}
.sunset-sandbox-page {
  margin: 0;
  overflow: hidden;
}
.sunset-footer--sandbox .sunset-footer-scene {
  height: 100vh;
  min-height: 0;
  overflow: hidden;
}
.sunset-footer--sandbox .sunset-footer-scene > #browser-sunset {
  -webkit-mask-image: none;
  mask-image: none;
}
.sunset-footer--sandbox .lil-gui {
  position: absolute;
  top: 1rem;
  right: 1rem;
  z-index: 3;
}
.sunset-footer-credit {
  font-size: 0.62rem;
  line-height: 1.35;
  opacity: 0.62;
  text-align: right;
}
.sunset-footer-experience {
  display: block;
  margin-top: 0.15rem;
}
[data-article-tags] {
  position: relative;
  z-index: 2;
}
</style>

<footer class="sunset-footer{{ if eq .RelPermalink "/sandbox/sunset/" }} sunset-footer--sandbox{{ end }}">
  <div class="sunset-footer-scene tw-w-full">
    <div id="browser-sunset" class="tw-w-full tw-h-full"></div>
    <span class="sunset-footer-credit tw-absolute tw-bottom-5 tw-right-5 tw-text-primary">
      <span>
        Plane by
        <a target="_blank" href="https://sketchfab.com/antonmoek">antonmoek</a> -
        <a target="_blank" href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>
      </span>
      {{ if ne .RelPermalink "/sandbox/sunset/" }}
        <a
          class="sunset-footer-experience"
          href="/sandbox/sunset/"
          onclick="window.gtag?.('event', 'sunset_fullscreen_experience_click', { destination: '/sandbox/sunset/' })"
        >Fullscreen experience</a>
      {{ end }}
    </span>
  </div>
</footer>

{{ partial "scripts/sunset.html" . }}
