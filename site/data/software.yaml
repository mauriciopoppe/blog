- id: ape
  title: APE
  first_commit: 2014-01-01
  order: 3
  description: A 3D rigid body physics engine built from scratch in JavaScript, beginning with particles and extending to rigid bodies and collision handling.
  why: I built APE as my undergraduate thesis after learning computer graphics with Three.js. I used it to study how physics and mathematics become a simulation, including how F = ma connects acceleration to velocity and position through integration. The thesis develops the theory of position, velocity, acceleration, and mass, then implements integration, collision detection, and collision resolution before demonstrating the engine in a billiards game.
