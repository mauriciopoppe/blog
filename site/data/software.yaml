- id: function-plot
  title: function-plot
  first_commit: 2015-03-29
  order: 1
  description: A versatile 2D function plotter built on [D3.js](https://d3js.org/) for rendering functions with little configuration. It supports interactive line charts and scatterplots, and evaluates functions again when the graph scale changes.
  why: >-
    When I started this blog, I decided to learn the fundamentals needed for
    computer graphics and physics engines. That path led me to learn and write
    about [derivatives](/notes/mathematics/calculus/derivative/), calculus, and
    related topics. I wanted to represent derivatives visually, but I could
    not find a library in the D3.js community that did this. I first wrote an
    inline D3.js script and then realized I could build an API around it.
    function-plot grew out of that experiment.

    This became one of the most complex projects I have worked on. A 2D
    plotter looks like a function sampler, but handling asymptotes and rapidly
    oscillating functions requires much more. I learned that plotting correctly
    is tied to how computers represent numbers and lose precision in values
    such as 1/3. That led me to write
    [interval-arithmetic](https://github.com/mauriciopoppe/interval-arithmetic),
    which works with intervals instead of individual numbers. I then wrote a
    parser from scratch to turn expressions such as `x^2+x-3` into executable
    JavaScript using interval arithmetic.

    I am still working on function-plot more than ten years later, and it
    continues to evolve with new features. The project has also brought me
    opportunities to meet one of the early employees of
    [Figma](https://www.figma.com/) and visit their offices, and to connect
    with the author of [GeoGebra](https://www.geogebra.org/?lang=en), one of
    the leading products for teaching mathematics.
  technologies: [JavaScript, visualization, mathematics]
  image: https://user-images.githubusercontent.com/1616682/93912098-23060300-fcb8-11ea-823f-be8dfe9c24b9.png
  image_alt: Function Plot rendering interactive mathematical curves.
  demo: https://mauriciopoppe.github.io/function-plot/
  source: https://github.com/mauriciopoppe/function-plot
  related:
    - title: "First article: Derivatives"
      url: /notes/mathematics/calculus/derivative/
    - title: Integrals
      url: /notes/mathematics/calculus/integral/
- id: greuler
  title: greuler
  first_commit: 2015-07-09
  order: 2
  description: >-
    A graph theory visualization tool powered by [D3.js](https://d3js.org/)
    and [WebCola](https://marvl.infotech.monash.edu/webcola/) for creating and
    manipulating graphs with a simple API. It can animate graph structures,
    traversals, and changes to nodes and edges. The project later reached the
    [top of Hacker News](https://www.daemonology.net/hn-daily/2015-07-17.html).
  why: >-
    I decided to learn more about graph theory and wanted to see algorithms
    unfold instead of only reading their descriptions. Once again, I could not
    find a JavaScript library with the interactivity I wanted, so I started
    with a D3.js script and then realized it could be abstracted into an API.

    I like that the API is declarative. You describe the nodes and edges you
    want, and the library makes the graph match that description. Later, I
    recognized this as a control loop: the system repeatedly reconciles the
    actual state of the graph with the desired state. Looking back, this gave
    me an early intuition for the controller pattern I would later encounter
    in [Kubernetes controllers](https://kubernetes.io/docs/concepts/architecture/controller/).

    The project became popular enough to reach the top of Hacker News in 2015,
    which is still one of the things I enjoy most about this project.
  technologies: [JavaScript, D3.js, WebCola, graphs, visualization]
  demo: https://mauriciopoppe.github.io/greuler/
  source: https://github.com/mauriciopoppe/greuler
  video: /video/greuler.mp4
  additional_images:
    - src: /images/software/greuler-hacker-news.webp
      alt: Screenshot showing Greuler at the top of Hacker News.
  related:
    - title: Hacker News top ranking
      url: https://www.daemonology.net/hn-daily/2015-07-17.html
- id: pojoviz
  title: PojoViz
  first_commit: 2014-07-04
  order: 1
  description: A runtime tool for visualizing the object structure of JavaScript libraries and frameworks, with SVG/D3 and Three.js renderers.
  why: >-
    I was learning JavaScript and wanted a better way to visualize the code I
    wrote. I built a tool that analyzed JavaScript object structures at runtime
    by following objects and their prototypes, including the `__proto__`
    inheritance model used before JavaScript classes. The project taught me
    that `typeof Function.prototype` is `function`, that some objects in
    `window` are read-only, and that many array-like objects exist deep in the
    `window` object graph. PojoViz was later featured in
    [JavaScript Weekly issue 194](https://javascriptweekly.com/issues/194),
    which showed me what was possible when I was ambitious enough to build and
    share an idea.
  technologies: [JavaScript, D3.js, SVG, Three.js, developer tools, visualization]
  demo: https://mauriciopoppe.github.io/PojoViz/
  source: https://github.com/mauriciopoppe/PojoViz
  video: /video/pojoviz.mp4
  additional_images:
    - src: /images/software/pojoviz.webp
      alt: PojoViz visualizing JavaScript object relationships.
  related:
    - title: JavaScript Weekly issue 194
      url: https://javascriptweekly.com/issues/194
