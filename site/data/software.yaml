- id: quickhull3d
  title: quickhull3d
  first_commit: 2015-03-09
  order: 3
  description: A fast JavaScript implementation of the 3D convex hull algorithm, optimized for JavaScript primitives such as ArrayBuffer.
  why: >-
    I first learned about convex hulls while practicing for the ICPC contest
    during my undergraduate studies. Later, I learned that convex hulls can
    reduce the geometry sent to physics engines such as APE. When I looked at
    the JavaScript ecosystem, I could not find a performant implementation, so
    I ported a popular Java implementation and optimized it for JavaScript
    primitives such as ArrayBuffer. The library became the fastest convex hull
    implementation in the JavaScript ecosystem. It was later incorporated into
    Three.js, where the new implementation reduced the runtime of finding
    convex hulls from quadratic time to n log n in
    [this pull request](https://github.com/mrdoob/three.js/pull/10987).
  technologies: [TypeScript, computational geometry]
  image: /images/software/quickhull3d.webp
  image_alt: Quickhull3d visualization of a convex hull around a set of points.
  source: https://github.com/mauriciopoppe/quickhull3d
- id: interval-arithmetic
  title: interval arithmetic
  first_commit: 2015-05-10
  order: 4
  description: >-
    A JavaScript implementation of interval arithmetic, adapted from
    [Boost's library](https://www.boost.org/). It represents possible values
    as bounded ranges instead of single floating-point approximations, giving
    [function-plot](#function-plot) the reliable bounds it needs to render
    asymptotes and rapidly oscillating curves.
  why: >-
    While working on function-plot, I learned that rendering a function
    correctly was a numerical problem, not only a visualization problem. I
    wanted the plotter to provide reliable bounds for every part of a curve,
    so I needed arithmetic that carried uncertainty through each operation.
    That led me to learn interval arithmetic and build this implementation.

    Calling interval methods directly quickly became cumbersome for complex
    expressions. Writing `sin(exp(x)) + tan(x) - 1/cos(PI) * [1, 3]^2` as
    nested method calls obscured the mathematics, so I also created an
    [interval arithmetic evaluator](https://github.com/mauriciopoppe/interval-arithmetic-eval)
    that parses expressions and evaluates them over intervals. That evaluator
    became part of the path from a string such as `x^2+x-3` to executable
    JavaScript in function-plot.
  technologies: [TypeScript, mathematics, numerical computing]
  image: /images/software/interval-arithmetic.webp
  image_alt: Interval arithmetic visualization showing bounded numerical values.
  demo: https://mauriciopoppe.github.io/interval-arithmetic/
  source: https://github.com/mauriciopoppe/interval-arithmetic
  related:
    - title: function-plot
      url: /software/#function-plot
