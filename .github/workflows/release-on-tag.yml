name: Release on Tag

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  discussions: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Generate Release Body
        id: release_info
        run: |
          TAG_NAME="${{ github.ref_name }}"
          echo "Processing tag: $TAG_NAME"

          # Extract slug after vYYYY-MM-DD-
          SLUG=$(echo "$TAG_NAME" | sed -E 's/^v[0-9]{4}-[0-9]{2}-[0-9]{2}-//')
          NOTE_FILE="site/content/notes/${SLUG}.md"

          if [ -f "$NOTE_FILE" ]; then
            echo "Found note file: $NOTE_FILE"
            bun -e '
              const fs = require("fs");
              const matter = require("front-matter");
              const raw = fs.readFileSync("'"$NOTE_FILE"'", "utf8");
              const parsed = matter(raw);
              const attrs = parsed.attributes || {};
              const title = attrs.title || "'"$SLUG"'";
              const summary = attrs.summary || "";
              const tags = (attrs.tags || []).map(t => `#${t}`).join(" ");
              const url = `https://mauriciopoppe.com/notes/'"$SLUG"'`;

              let body = `## [${title}](${url})\n\n`;
              if (summary) body += `${summary}\n\n`;
              if (tags) body += `**Tags**: ${tags}\n\n`;
              body += `👉 **Read Full Note**: [${url}](${url})\n`;

              fs.writeFileSync("release_body.md", body, "utf8");
              console.log("RELEASE_TITLE=" + title);
            ' >> $GITHUB_ENV
          else
            echo "Release for tag $TAG_NAME" > release_body.md
            echo "RELEASE_TITLE=$TAG_NAME" >> $GITHUB_ENV
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ env.RELEASE_TITLE }}" \
            --notes-file release_body.md \
            --discussion-category "Announcements" \
            --verify-tag
