name: Update Algolia Index

on:
  push:
    branches:
      - main
    paths:
      - 'site/content/**'
  schedule:
    # Weekly drift safety net in case a push was missed
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  algolia:
    name: Regenerate and push search index
    runs-on: ubuntu-latest
    # ALGOLIA_WRITE_KEY lives in the "main" environment, so the job must opt
    # into it or the secret resolves empty.
    environment: main
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Push Index to Algolia
        env:
          ALGOLIA_WRITE_KEY: ${{ secrets.ALGOLIA_WRITE_KEY }}
        run: bun run generate:algolia:send
